[project]
name = "cagecfi-chatbot"
version = "0.1.0"
description = "Chatbot RAG CAGECFI : Supabase pgvector + Pydantic AI + OpenAI"
requires-python = ">=3.10"
# IMPORTANT : ne lister ici QUE les dépendances nécessaires au runtime de
# l'API /chat (déployée en serverless sur Vercel). Vercel utilise uv et
# installe depuis pyproject.toml — toute dépendance lourde ici alourdit /
# casse le build. Les outils lourds (Docling, Whisper, Streamlit) sont en
# extras optionnels ci-dessous et ne servent qu'en local.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pydantic-ai==1.36.0",
    "openai>=1.58.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Ingestion locale des documents (Docling + transcription audio). JAMAIS sur Vercel.
#   uv pip install -e ".[ingestion]"
ingestion = [
    "docling>=2.14.0",
    "docling-core>=2.4.0",
    "transformers>=4.47.0",
    "openai-whisper>=20240930",
    "aiofiles>=24.1.0",
    "pypdf>=6.0.0",
    "pypdfium2>=4.30.0",
    "python-frontmatter>=1.1.0",
]
# Interfaces locales (CLI Rich + app Streamlit).
#   uv pip install -e ".[ui]"
ui = [
    "streamlit>=1.40.0",
    "rich>=13.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Ne packager que le code applicatif `src` (et ses sous-packages). Évite que
# setuptools tente de packager api/ ou les scripts racine et échoue.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: tests unitaires sans I/O reseau",
    "integration: tests necessitant un service externe",
]
asyncio_mode = "auto"
